<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Junot Randrianarivo" />
    <meta name="theme-color" content="#0e2230" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://portfolio-junot.vercel.app/og-image.png" />
    <meta property="og:image:alt" content="Junot Randrianarivo, Full-Stack JavaScript Developer" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Runs before first paint and before Vue starts:
         - theme: avoid a flash of the wrong theme (dark is the default);
         - language: a visitor who chose French is sent to /fr/ before hydration, so the prerendered
           English HTML is never hydrated with French text. -->
    <script>
      try {
        if (localStorage.getItem('theme') === 'light') document.documentElement.classList.remove('dark')
        if (location.pathname === '/' && localStorage.getItem('locale') === 'fr') location.replace('/fr/' + location.hash)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
